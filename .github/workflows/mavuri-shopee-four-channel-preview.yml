name: Mavuri Shopee Four Channel Preview
on:
  schedule:
    # 30-minute inspection only; no publishing or queue mutation.
    # Diagnostic counters audit: aggregate candidate rejection reasons.
    # Read-only commercial sync projection (no database writes).
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/mavuri-shopee-four-channel-preview.yml]
permissions:
  contents: read
concurrency:
  group: mavuri-shopee-four-channel-readonly-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: mavuri-auth-test
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright-core@1.55.0
      - run: node scripts/cloud-runner/shopee-four-channel-preview.mjs
        env:
          MAVURI_CLOUD_LIVE_ENABLED: 'NO'
          MAVURI_AUTO_INGEST: 'false'
          MAVURI_AUTH_BUNDLE: ${{ secrets.MAVURI_AUTH_BUNDLE }}
          MAVURI_AUTH_KEY: ${{ secrets.MAVURI_AUTH_KEY }}
