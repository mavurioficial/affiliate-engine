name: Mavuri - teste unico foto Amazon
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Verificar ou publicar foto do ultimo produto identificado no dia 20/11"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish
permissions:
  contents: read
  id-token: write
concurrency:
  group: mavuri-amazon-image-test-20261120
  cancel-in-progress: false
jobs:
  preview-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Telegram and image deps
        run: npm install --no-save --no-audit --no-fund teleproto@1.232.1 sharp@0.34.5
      - name: Compare last Amazon message and post photo once if publish mode
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TEST_MODE: ${{ inputs.mode }}
        run: node scripts/mavuri-amazon-photo-test-20261120.mjs
