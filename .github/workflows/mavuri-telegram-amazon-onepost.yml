name: Mavuri - Espelhamento Amazon Telegram

on:
  # Scheduled from Supabase pg_cron to avoid missed GitHub schedule executions.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Testar leitura ou espelhar todas as ofertas Amazon nos grupos Mavuri'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - send
          - cleanup
          - reconcile

permissions:
  contents: read
  id-token: write

concurrency:
  group: mavuri-telegram-amazon-onepost
  cancel-in-progress: false

jobs:
  onepost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate ASIN resolver without Telegram
        run: node --test scripts/telegram-cloud-onepost.test.mjs
      - name: Install Telegram client
        run: npm install --no-save --ignore-scripts --no-audit --no-fund teleproto@1.232.1
      - name: Read joined Telegram group and mirror all recent Amazon offers
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          PILOT_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
        run: node scripts/telegram-cloud-onepost.mjs
