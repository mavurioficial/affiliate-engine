name: "Mavuri - teste isolado link afiliado ML"
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavuri-ml-one-product-link-probe
  cancel-in-progress: false

jobs:
  one_product_link_probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: mavuri-auth-test
    timeout-minutes: 5
    steps:
      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser controller
        run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright-core@1.55.0
      - name: Run offline response validation
        run: node scripts/cloud-runner/ml-link-conversion-probe.mjs --self-test
      - name: Probe one ML affiliate link in an existing authorized session
        env:
          MAVURI_AUTH_BUNDLE: ${{ secrets.MAVURI_AUTH_BUNDLE }}
          MAVURI_AUTH_KEY: ${{ secrets.MAVURI_AUTH_KEY }}
        run: node scripts/cloud-runner/ml-link-conversion-probe.mjs
