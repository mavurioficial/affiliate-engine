name: Mavuri Check

on:
  push:
    branches: ["main", "feat/mavuri-flow-v1", "feat/discovery-cloud-foundation-20261022"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
      - run: node scripts/test-cloud-runner-linux-kit.mjs
      - run: node scripts/test-ml-v86-pure.mjs
      - run: node scripts/test-ml-cloud-ownership.mjs
      - run: node scripts/test-ml-only-v86.mjs
      - run: node scripts/test-shopee-single-pilot-gate.mjs
      - run: node scripts/test-ml-origin-readonly.mjs
      - run: node scripts/test-cloud-auth-state.mjs
      - run: node scripts/test-discovery-cloud-shopee.mjs
      - run: node scripts/test-discovery-cloud-shopee-policy.mjs
      - run: node scripts/test-discovery-cloud-shopee-history.mjs
      - run: node scripts/test-discovery-cloud-shopee-general-audit.mjs
      - run: node scripts/test-discovery-cloud-shopee-routing-shadow.mjs
      - run: node scripts/test-discovery-cloud-shopee-db-category-parity.mjs
      - run: node scripts/test-discovery-cloud-shopee-category-impact.mjs
      - run: node scripts/test-discovery-cloud-shopee-postpersist-plan.mjs
      - run: node scripts/test-discovery-cloud-shopee-single-preflight.mjs
      - run: node scripts/test-shopee-single-commercial-refresh.mjs
      - run: node scripts/test-shopee-api-binding.mjs
      - run: node scripts/test-discovery-cloud-shopee-strict-price.mjs
      - run: node scripts/test-flow-worker-rendered-price-snapshot-candidate.mjs
      - run: node scripts/test-discovery-cloud-shopee-seller-metadata.mjs
      - run: node scripts/test-discovery-cloud-shopee-live-rule-snapshot.mjs
      - run: node scripts/test-discovery-cloud-shopee-queue-release-gate.mjs
      - run: node scripts/test-discovery-cloud-shopee-queue-sql-draft.mjs
      - run: node scripts/test-flow-delivery-inflight-unique-migration.mjs
      - run: node scripts/test-shopee-cloud-queue-fence.mjs
      - run: node scripts/test-shopee-cloud-trigger-compatibility.mjs
      - run: node scripts/test-shopee-publish-window.mjs
      - run: node scripts/test-shopee-cloud-worker-window.mjs
      - run: node scripts/test-shopee-cloud-run-start-window.mjs
      - run: node scripts/test-shopee-cloud-routing-matcher.mjs
      - run: node scripts/test-shopee-legacy-writer-fence.mjs
      - run: node scripts/test-shopee-cloud-atomic-enqueue.mjs
      - run: node scripts/test-shopee-cloud-catalog-refresh.mjs
      - run: node scripts/test-shopee-cloud-catalog-executor.mjs
      - run: node scripts/test-shopee-cloud-live-orchestration.mjs
      - run: node scripts/test-discovery-cloud-shopee-atomic-draft.mjs
      - run: node scripts/test-discovery-cloud-shopee-sql-matcher.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=auto supabase/functions/discovery-cloud-ml-origin-probe/index.ts
      - run: deno check supabase/functions/discovery-cloud-shopee/index.ts
      - run: deno check supabase/functions/discovery-cloud-shopee-binding/index.ts
      - run: deno check supabase/functions/discovery-cloud-shopee-refresh-one/index.ts
      - run: deno check supabase/functions/discovery-cloud-shopee-pilot/index.ts
      - run: deno check supabase/functions/discovery-cloud-shopee-diagnostic/index.ts
      - run: deno check supabase/functions/discovery-cloud-shopee-diagnostic/commercial-refresh-plan.mjs
      - run: deno check --node-modules-dir=auto supabase/functions/discovery-cloud-shopee-executor/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/flow-worker/index.ts
      - run: deno check supabase/functions/discovery-cloud-shopee-diagnostic/cycle-plan.mjs
      - run: deno run scripts/test-shopee-four-channel-cycle.mjs
      # Deployed worker v38 contains two pre-existing TypeScript issues at secret key selection.
      # Keep snapshot static regression until the live source can be type-narrowed safely.
