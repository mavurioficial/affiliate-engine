name: Mavuri Check

on:
  push:
    branches: ["main", "feat/mavuri-flow-v1"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
      - run: node scripts/test-discovery-cloud-shopee.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/discovery-cloud-shopee/index.ts
