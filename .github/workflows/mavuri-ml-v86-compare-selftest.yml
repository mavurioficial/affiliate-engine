name: "Mavuri - validação segura do comparador V86"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check (no browser, no login)
        run: node --check scripts/cloud-runner/ml-v86-session-inspect.mjs
      - name: Install local controller
        run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright-core@1.55.0
      - name: Offline classification self-test
        run: node scripts/cloud-runner/ml-v86-session-inspect.mjs --self-test
      - name: Offline ML direct-tag product links safety tests (no network)
        run: node --test scripts/cloud-runner/ml-direct-tag-candidate.test.mjs
      - name: Print one NOT-VERIFIED candidate demo (no publication)
        run: node scripts/cloud-runner/ml-direct-tag-candidate.mjs "https://www.mercadolivre.com.br/maquininha-3-em-1-kemei-km-1910-aparador-pelo-corpo-agua-resistente/p/MLB21835256"
