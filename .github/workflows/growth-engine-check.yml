name: Mavuri Growth Engine V1

on:
  pull_request:
    paths:
      - "entrar/**"
      - "growth/**"
      - "scripts/growth-*.mjs"
      - "scripts/test-growth.mjs"
      - "supabase/functions/mavuri-growth-event/**"
      - "supabase/migrations/*growth*"
      - "package.json"
      - ".github/workflows/growth-engine-check.yml"

jobs:
  growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm run growth:test
      - run: npm run build
      - name: Verify landing tracking asset
        run: test -f dist/entrar/growth.js
