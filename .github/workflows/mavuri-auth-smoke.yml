name: "Mavuri - teste autenticado (somente leitura)"
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavuri-auth-smoke-single
  cancel-in-progress: false

jobs:
  authenticate_read_only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: mavuri-auth-test
    timeout-minutes: 5
    env:
      MAVURI_AUTH_BUNDLE: ${{ secrets.MAVURI_AUTH_BUNDLE }}
      MAVURI_AUTH_KEY: ${{ secrets.MAVURI_AUTH_KEY }}
      MAVURI_AUTO_INGEST: "false"
      MAVURI_CLOUD_LIVE_ENABLED: "NO"
    steps:
      - name: "Checkout trusted main only"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: "Setup Node 24"
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: "Install browser controller (no postinstall scripts)"
        run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright-core@1.55.0
      - name: "Verify Mercado Livre and Mavuri sessions, no publication"
        run: node scripts/cloud-runner/auth-smoke.mjs
