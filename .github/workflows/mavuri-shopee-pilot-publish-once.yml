name: Mavuri Shopee - Publicar Uma Oferta Real
on:
  push:
    branches: [main]
    paths: [.github/workflows/mavuri-shopee-pilot-publish-once.yml]
permissions:
  contents: read
concurrency:
  group: mavuri-shopee-first-one-live
  cancel-in-progress: false
jobs:
  first_offer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: mavuri-auth-test
    timeout-minutes: 6
    env:
      MAVURI_AUTO_INGEST: 'false'
      MAVURI_CLOUD_LIVE_ENABLED: 'NO'
      MAVURI_PILOT_LIVE: 'AUTHORIZE_EXACTLY_ONE_GENERAL'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/cloud-runner/shopee-pilot-publish-once.mjs
      - run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright-core@1.55.0
      - name: Publish one vetted Shopee offer to Mavuri Ofertas and verify outcome
        env:
          MAVURI_AUTH_BUNDLE: ${{ secrets.MAVURI_AUTH_BUNDLE }}
          MAVURI_AUTH_KEY: ${{ secrets.MAVURI_AUTH_KEY }}
        run: node scripts/cloud-runner/shopee-pilot-publish-once.mjs
