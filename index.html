<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Administração do Mavuri Affiliate Engine" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Mavuri Affiliate Engine</title>
    <link rel="stylesheet" href="./src/styles.css?v=2026.08.28.12" />
    <link rel="stylesheet" href="./src/app.css?v=2026.08.28.12" />
  </head>
  <body>
    <div id="app">Carregando Mavuri...</div>
    <div id="mavuri-version-badge">APP 2026.08.28.12</div>
    <style>
      #mavuri-version-badge{position:fixed;right:12px;bottom:10px;z-index:2147483647;padding:7px 10px;border-radius:6px;background:#1f3d2a;color:#fff;font:700 11px/1.2 Arial,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25);letter-spacing:.3px}
      #mavuri-startup-error{margin:24px;font:14px/1.5 Arial,sans-serif;color:#8b1e1e;white-space:pre-wrap}
    </style>
    <script>
      window.addEventListener('error', function(event) {
        console.error('Erro global do Mavuri:', event.error || event.message)
      })
      window.addEventListener('unhandledrejection', function(event) {
        console.error('Promise rejeitada no Mavuri:', event.reason)
      })
      window.setTimeout(function () {
        const app = document.getElementById('app')
        if (app && app.textContent.trim() === 'Carregando Mavuri...') {
          app.textContent = 'Inicialização demorou mais de 12 segundos. Aguarde o diagnóstico ou recarregue a página.'
        }
      }, 12000)
      ;(async function startMavuri() {
        try {
          await import('./src/offers-fetch-bridge.js?v=2026.08.28.12')
          await import('./src/main.js?v=2026.08.28.12')
          await import('./src/hub-workflow.js?v=2026.08.28.12')
        } catch (error) {
          console.error('Falha ao iniciar o Mavuri:', error)
          const app = document.getElementById('app')
          if (app) {
            app.innerHTML = '<div id="mavuri-startup-error"><strong>Erro de inicialização do Mavuri</strong>\n\n' +
              String(error && (error.stack || error.message) || error) +
              '\n\nVersão: APP 2026.08.28.12</div>'
          }
        }
      })()
    </script>
  </body>
</html>
