<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mavuri Flow — captura e distribuição de ofertas afiliadas" />
    <title>Mavuri Affiliate Engine</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/app.css" />
    <style>
      #mavuri-version{position:fixed;right:12px;bottom:8px;z-index:9999;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.88);color:#667085;border:1px solid rgba(102,112,133,.22);font:11px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none}
      #mavuri-boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
      #mavuri-boot-card{width:min(560px,100%);padding:28px;border:1px solid #e4e7ec;border-radius:16px;background:#fff;box-shadow:0 12px 32px rgba(16,24,40,.08);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #mavuri-boot-card h1{margin:0 0 8px;font-size:24px} #mavuri-boot-card p{color:#667085;line-height:1.5}
      #mavuri-boot-error{display:none;margin-top:16px;padding:12px;border-radius:10px;background:#fff1f3;color:#8b1e1e;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
    </style>
  </head>
  <body>
    <div id="app"><main id="mavuri-boot" aria-live="polite"><section id="mavuri-boot-card"><h1>Mavuri Flow</h1><p>Carregando a aplicação...</p><div id="mavuri-boot-error"></div></section></main></div>
    <div id="mavuri-version">Mavuri v0.1.27</div>
    <script>
      (()=>{const showBootError=(message)=>{const box=document.querySelector('#mavuri-boot-error');if(!box)return;box.textContent=message;box.style.display='block'};window.addEventListener('error',event=>showBootError('Erro ao carregar a aplicação: '+(event.message||'falha de JavaScript')));window.addEventListener('unhandledrejection',event=>{const reason=event.reason;showBootError('Erro ao iniciar a aplicação: '+(reason?.message||String(reason||'Promise rejeitada')))})})()
    </script>
    <script type="module" src="./src/main.js?v=0.1.27"></script>
  </body>
</html>
