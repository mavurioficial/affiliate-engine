<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Administração do Mavuri Affiliate Engine" />
    <title>Mavuri Affiliate Engine</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            await navigator.serviceWorker.register('./offers-service-worker.js', { scope: './' })
          } catch (error) {
            console.error('Falha ao iniciar busca de ofertas:', error)
          }
        })
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
